name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit specs (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run unit specs
        run: bundle exec rspec spec/lib

  spree:
    name: Spree ${{ matrix.spree }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spree: ['~> 5.4.0', '~> 5.6.1']
    env:
      SPREE_VERSION: ${{ matrix.spree }}
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips
      - name: Create test app
        run: bundle exec rake test_app
      - name: Run specs
        run: bundle exec rspec
